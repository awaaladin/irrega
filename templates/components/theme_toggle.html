{% load ui %}
{# ThemeToggle: a real switch with thumb travel. Dark "Estuary Night" / light "Harmattan Paper". #}
<button type="button" role="switch" aria-checked="false" :aria-checked="$store.ui.theme === 'light'" @click="$store.ui.toggleTheme()"
        class="relative inline-flex h-11 w-[68px] shrink-0 items-center rounded-full border border-line bg-sunken px-1" aria-label="Light theme">
  <span class="pointer-events-none absolute left-2.5 text-mute">{% icon "moon" "h-4 w-4" %}</span>
  <span class="pointer-events-none absolute right-2.5 text-mute">{% icon "sun" "h-4 w-4" %}</span>
  <span class="relative z-10 flex h-9 w-9 items-center justify-center rounded-full bg-raised text-ink shadow-raised transition-transform duration-300 ease-[cubic-bezier(.34,1.56,.64,1)]"
        :class="$store.ui.theme === 'light' ? 'translate-x-[24px]' : 'translate-x-0'">
    <svg class="h-4 w-4 fill-none stroke-current" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use :href="$store.ui.theme === 'light' ? '#i-sun' : '#i-moon'"/></svg>
  </span>
</button>
